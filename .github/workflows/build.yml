name: Unsigned browser trial (public standard runner only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unsigned-browser-trial
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download locked public archive (no installer)
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/leeguooooo/iphone-use/releases/download/v0.27.31/iphone-use-app.tar.gz' \
            --output "$RUNNER_TEMP/upstream.tar.gz"
          python3 prepare.py "$RUNNER_TEMP/upstream.tar.gz" --output "$RUNNER_TEMP/prepared"
      - name: Build only; no Apple identity or signing secrets
        run: bash build-unsigned.sh "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/result"
      - name: Real WebKit synthetic test (macOS, not iPhone)
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          python3 test-webkit.py "$RUNNER_TEMP/prepared/app/apps/ios/IPhoneUseRemote/Sources" "$RUNNER_TEMP/webkit" | tee "$RUNNER_TEMP/result/webkit-results.txt"
      - name: Save unsigned package to an owner-only draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "unsigned-trial-${GITHUB_RUN_ID}" --draft \
            --title 'UNSIGNED browser trial; not device verified' \
            --notes 'Unsigned source build. No Apple credentials used. Native tests and iPhone installation not yet verified. Original upstream license applies.' \
            "$RUNNER_TEMP/result/browser-trial-UNSIGNED.ipa" \
            "$RUNNER_TEMP/result/browser-trial-UNSIGNED.ipa.sha256" \
            "$RUNNER_TEMP/result/build-environment.txt" \
            "$RUNNER_TEMP/result/webkit-results.txt"
